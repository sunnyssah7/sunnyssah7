<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="200" viewBox="0 0 1000 200">
  <defs>
    <style>
      .n{font:800 84px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:-2px}
      .m{font:500 15px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:4px}
      .main{fill:#eef1f8}
      .r{fill:#ffa860;mix-blend-mode:screen;animation:gr 3.2s infinite steps(1)}
      .b{fill:#2f86ff;mix-blend-mode:screen;animation:gb 3.2s infinite steps(1)}
      .slice{animation:sl 3.2s infinite steps(1)}
      .scan{fill:url(#sg);animation:scan 4s linear infinite}
      .cur{fill:#ffa860;animation:bl 1s infinite steps(1)}
      .sub{fill:#878ea3;opacity:0;animation:in 1s 0.4s forwards}
      @keyframes gr{0%,86%,100%{transform:translate(0,0);opacity:0}88%{transform:translate(-6px,2px);opacity:.9}91%{transform:translate(5px,-3px);opacity:.9}94%{transform:translate(-3px,0);opacity:.9}}
      @keyframes gb{0%,86%,100%{transform:translate(0,0);opacity:0}88%{transform:translate(6px,-2px);opacity:.9}91%{transform:translate(-5px,3px);opacity:.9}94%{transform:translate(3px,1px);opacity:.9}}
      @keyframes sl{0%,87%,100%{clip-path:inset(0 0 0 0);transform:none}89%{clip-path:inset(30% 0 45% 0);transform:translateX(12px)}92%{clip-path:inset(60% 0 10% 0);transform:translateX(-10px)}}
      @keyframes scan{0%{transform:translateY(-60px)}100%{transform:translateY(220px)}}
      @keyframes bl{50%{opacity:0}}
      @keyframes in{to{opacity:1}}
    </style>
    <linearGradient id="sg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f86ff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#2f86ff" stop-opacity=".12"/>
      <stop offset="1" stop-color="#2f86ff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="lines" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#fff" fill-opacity=".035"/></pattern>
  </defs>
  <rect width="1000" height="200" fill="#05060a"/>
  <text x="500" y="34" text-anchor="middle" class="m sub">// SIGNAL ACQUIRED</text>
  <g text-anchor="middle">
    <text x="500" y="122" class="n r">SANDEEP SAH</text>
    <text x="500" y="122" class="n b">SANDEEP SAH</text>
    <text x="500" y="122" class="n main slice">SANDEEP SAH</text>
  </g>
  <text x="500" y="168" text-anchor="middle" class="m sub">EE · EDGE AI · ROBOTICS · FOUNDER<tspan class="cur"> █</tspan></text>
  <rect width="1000" height="200" fill="url(#lines)"/>
  <rect class="scan" y="0" width="1000" height="60"/>
</svg>
